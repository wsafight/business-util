name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
    # Only deploy when files that affect the generated Astro site change.
    paths:
      - ".github/workflows/deploy.yml"
      - "package.json"
      - "bun.lock"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "sidebar.json"
      - "src/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build and upload site
        uses: withastro/action@v6
        with:
          package-manager: bun@1.3.13

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
